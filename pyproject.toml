[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-ref-cli"
version = "0.4.0"
description = "Evidence-backed game UX/UI research and specification compiler: references, contracts, wireframes, prototypes, and engine handoff."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["game-ui", "ui", "ux", "reference", "design", "specification", "wireframe", "prototype"]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/SillyToolValley/Game-UI-Reference-Cli"
Repository = "https://github.com/SillyToolValley/Game-UI-Reference-Cli"

[project.scripts]
ui-ref = "ui_ref_cli:main"

[tool.setuptools]
py-modules = ["ui_ref_cli", "ui_ref_design"]
